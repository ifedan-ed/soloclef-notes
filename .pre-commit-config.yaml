# Pre-commit configuration for Soloclef
# See https://pre-commit.com for more information

repos:
  # General file quality hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--multi, --unsafe]
      - id: check-json
        exclude: '(tsconfig\.json|\.vscode/.*\.json)$'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=10240]  # 10MB limit
      - id: debug-statements
      - id: check-case-conflict

  # Security - detect secrets across all file types
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*\.env\.example|
            .*\.env\.go\.example|
            .*\.env\.template|
            .*/tests/.*|
            .*_test\.go|
            .forgejo/workflows/.*\.yml|
            .forgejo/workflows/.*\.yaml|
            .*pnpm-lock\.yaml|
            .*\.mdx$|
            .*/messages/.*\.json$
          )$

  # Go: gofmt over every module. The repo has no Go workspace, so the hook
  # runs gofmt on the changed files themselves rather than `go fmt` per module.
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'unformatted=$(gofmt -l "$@"); [ -z "$unformatted" ] || { echo "not gofmt-ed:"; echo "$unformatted"; exit 1; }' --
        language: system
        files: \.go$

  # Biome hooks for TypeScript/JavaScript projects
  - repo: local
    hooks:
      # Biome check for soloclef_web
      - id: biome-check-web
        name: biome-check-web
        entry: bash -c 'cd soloclef_web && npx @biomejs/biome@2.4.6 check --diagnostic-level=error .'
        language: system
        files: ^soloclef_web/
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Commit message linting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

# Global configuration
default_stages: [pre-commit]
fail_fast: false

