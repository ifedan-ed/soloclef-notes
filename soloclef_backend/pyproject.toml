[project]
name = "soloclef-backend"
version = "0.0.40"
description = "Soloclef Backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "authlib>=1.6.9",
    "PyJWT>=2.12.0",
    "tornado>=6.5.5",
    "datasets>=2.21.0",
    "pyarrow>=15.0.0,<19.0.0",
    "fastapi>=0.115.8",
    "google-api-python-client>=2.156.0",
    "google-auth-oauthlib>=1.2.1",
    # LlamaCloud's SDK, which speaks its v2 Parse API. It replaces
    # llama-cloud-services, whose v1 API LlamaCloud refuses to some accounts
    # (app/etl_pipeline/parsers/llamacloud.py).
    "llama-cloud>=2.16.0,<3",
    "Markdown>=3.7",
    "markdownify>=0.14.1",
    "numpy>=1.24.0",
    "pgvector>=0.3.6",
    "pypdf>=5.1.0",
    "pymupdf4llm>=1.28.2",
    # pymupdf4llm pulls pymupdf + pymupdf_layout itself, but its OCR
    # backend is an undeclared soft dependency: pymupdf4llm/ocr/ does
    # `import rapidocr` and silently loses OCR when it is missing.
    # Docling used to drag rapidocr in; now that it is gone we ask for
    # it by name.
    "rapidocr>=3.7.0",
    "python-ffmpeg>=2.0.12",
    "rerankers[api]>=0.7.1",
    "spacy>=3.8.7",
    "en-core-web-sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "static-ffmpeg>=2.13",
    "uvicorn[standard]>=0.34.0",
    "validators>=0.34.0",
    "youtube-transcript-api>=1.0.3",
    "celery[redis]>=5.5.3",
    "redis>=5.2.1",
    "boto3>=1.35.0",
    "fake-useragent>=2.2.0",
    "trafilatura>=2.0.0",
    "fastapi-users[oauth,sqlalchemy]>=15.0.3",
    # Chunking (RecursiveChunker, CodeChunker) and the hosted embedding
    # clients this server builds (app/embedding_roles): litellm for
    # EMBEDDING_MODEL=litellm://..., catsu for openai://, cohere://, jina://,
    # tokenizers so EMBEDDING_TOKENIZER can name a HuggingFace tokenizer
    # (app/config/chunk_sizing.py), code for CodeChunker's tree-sitter
    # grammars. NOT [all]: that extra pulls sentence-transformers, torch,
    # transformers, model2vec and a dozen vector-store clients -- in-process
    # embedding models and handoff targets this server does not use.
    "chonkie[catsu,code,litellm,tokenizers]>=1.5.0",
    # Pinned: checkpoint_serde registers Soloclef state types against this
    # serializer; upgrade deliberately and rerun scripts/verify_checkpoint_serde.py.
    "langgraph-checkpoint==4.0.1",
    "langgraph-checkpoint-postgres==3.0.5",
    "psycopg[binary,pool]>=3.3.2",
    "mcp>=1.25.0",
    "starlette>=0.40.0,<0.51.0",
    "sse-starlette>=3.1.1,<3.1.2",
    "slowapi>=0.1.9",
    "pypandoc_binary>=1.16.2",
    "pypandoc>=1.16.2",
    "fractional-indexing>=0.1.3",
    "langchain>=1.2.13",
    "langgraph==1.1.3",
    "langchain-community>=0.4.1",
    "stripe>=15.0.0",
    "azure-ai-documentintelligence>=1.0.2",
    "litellm>=1.83.7",
    "langchain-litellm>=0.6.4",
    "deepagents>=0.4.12,<0.5",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp>=1.40.0",
    "opentelemetry-semantic-conventions>=0.61b0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.61b0",
    "opentelemetry-instrumentation-psycopg>=0.61b0",
    "opentelemetry-instrumentation-redis>=0.61b0",
    "opentelemetry-instrumentation-httpx>=0.61b0",
    "opentelemetry-instrumentation-celery>=0.61b0",
    "opentelemetry-instrumentation-logging>=0.61b0",
    "python-telegram-bot>=22.7",
    "croniter>=2.0.0",
    "scrapling[fetchers]>=0.4.11",
    "posthog>=6.0.0",
    "dulwich>=0.22.0",
    "opensandbox==0.1.15",
    "opensandbox-code-interpreter==0.1.2",
    "pillow>=12.1.1",
    # These four arrived transitively with unstructured[all-docs] and are
    # named here now that it is gone. xlrd reads a legacy .xls mail
    # attachment (app/connectors/email_imap/attachments.py); langdetect
    # names a snippet's language (app/quick_tasks/language.py). python-docx
    # and python-pptx only *write* the .docx/.pptx that tests/e2e/seed.py
    # and the attachment tests read back -- the app parses those with MuPDF
    # and writes neither -- but they belong here, not in the dev group,
    # because the e2e image installs with --no-dev (Dockerfile stage 2).
    "xlrd>=2.0.1",
    "langdetect>=1.0.9",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14",
    "httpx>=0.28.1",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4

# Python 3.12
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",     # pycodestyle errors
    "E7",     # pycodestyle errors  
    "E9",     # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]

ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "T201",   # Print found (allow print statements)
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
]

extend-select = ["I"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "auto"


[tool.ruff.lint.isort]
# Group imports by type
known-first-party = ["app", "tests"]
force-single-line = false
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -x --strict-markers -ra --durations=5 --import-mode=importlib"
markers = [
    "unit: pure logic tests, no DB or external services",
    "integration: tests that require real infrastructure (PostgreSQL, Redis)"
]
filterwarnings = [
    "ignore::UserWarning:chonkie",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "alembic*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
