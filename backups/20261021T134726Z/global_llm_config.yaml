# Soloclef Notes: the shared models every account gets, served by LiteLLM.
#
# Mounted read-only into backend, celery_worker and celery_beat at
# /app/app/config/global_llm_config.yaml (docker-compose.override.yml), where
# SurfSense turns each entry into a server-owned GLOBAL model. No secret is
# in this file: "os.environ/OPENAI_API_KEY" is read from docker/.env at start
# (the LiteLLM key the deployment already uses), and never sent to browsers.
#
# Names shown to people come from app/model_display_names/names.py, keyed by
# model_name; add a `name:` here only to override that table for one entry.
# Tiers here are what Auto and the model picker read; the billing admin page
# (Billing -> Admin -> Model tiers) holds the same choice for charging, and
# the two are kept equal. Workspace defaults: app/workspace_model_defaults.
#
# IDs are stable: workspaces store them as their chosen models. Never reuse
# or renumber one; retire an entry by deleting it (workspaces fall back to
# Auto). Chat -1..-999, image generation -2001..-2999.
#
# The list is the 15 models enabled on 2026-09-25 across the owner's two
# LiteLLM connections: 14 distinct ids (openai-gpt-6-luna was enabled on
# both). openrouter-bge-m3 is an embedding model; SurfSense has no per-user
# embedding choice (EMBEDDING_MODEL is app-wide), so it is not listed here.
# Groq's Qwen 3.8 and 3.6 (-8, -9) were removed on 2026-09-27 at the owner's request.

router_settings:
  routing_strategy: "usage-based-routing"
  num_retries: 3
  allowed_fails: 3
  cooldown_time: 60

global_llm_configs:
  - id: -1
    model_name: "ds-deepseek-v4.1-flash"
    provider: "openai_compatible"
    api_base: "http://litellm:4000/v1"
    api_key: "os.environ/OPENAI_API_KEY"
    billing_tier: "standard"
    supports_image_input: true
    supports_tools: true
    max_input_tokens: 1000000

  - id: -2
    model_name: "openai-gpt-5.6-luna"
    provider: "openai_compatible"
    api_base: "http://litellm:4000/v1"
    api_key: "os.environ/OPENAI_API_KEY"
    billing_tier: "standard"
    router_pool_eligible: false
    supports_image_input: true
    supports_tools: true
    max_input_tokens: 922000

  - id: -3
    model_name: "openai-gpt-6-luna"
    provider: "openai_compatible"
    api_base: "http://litellm:4000/v1"
    api_key: "os.environ/OPENAI_API_KEY"
    billing_tier: "premium"
    router_pool_eligible: false
    supports_image_input: true
    supports_tools: true
    max_input_tokens: 1050000

  - id: -6
    model_name: "mistral-medium"
    provider: "openai_compatible"
    api_base: "http://litellm:4000/v1"
    api_key: "os.environ/OPENAI_API_KEY"
    billing_tier: "standard"
    router_pool_eligible: false
    supports_image_input: true
    supports_tools: true
    max_input_tokens: 262144

  - id: -7
    model_name: "openrouter-llama-3.3-70b-instruct"
    provider: "openai_compatible"
    api_base: "http://litellm:4000/v1"
    api_key: "os.environ/OPENAI_API_KEY"
    billing_tier: "standard"
    router_pool_eligible: false
    supports_image_input: false
    supports_tools: true

