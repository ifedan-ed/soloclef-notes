name: Tests

# Our CI, on our Forgejo runner. It replaces upstream SurfSense's GitHub
# workflows (image publishing, desktop releases, their PR checks), which
# could not run here and tested things we do not ship.
#
# The web app's unit tests on every push and pull request; the Go modules
# have a workflow of their own (go.yml). The Playwright journey needs the
# whole Docker stack, so it stays a manual run:
#   bash soloclef_web/scripts/e2e-stack-go.sh rebuild && (cd soloclef_web && pnpm test:e2e)
#
# NOTHING BELOW HAS EVER RUN: no runner has been registered for this
# repository (checked 2026-11-08). Until one is, with the ubuntu-latest label
# asked for below, a green tick here means a job was cancelled while waiting,
# not that the tests passed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@10.26.0
      - name: Install dependencies
        working-directory: soloclef_web
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        working-directory: soloclef_web
        run: pnpm test:unit
