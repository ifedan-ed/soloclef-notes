name: Go

# Build, vet, format and test every Go module, each in a job of its own.
#
# NOTHING HERE HAS EVER RUN: no runner has been registered for this
# repository (checked 2026-11-08). A green tick on this workflow means a job
# was cancelled while waiting, not that the checks passed. Until there is a
# runner, the commands below are the ones to run by hand (AGENTS.md).
#
# The toolchain. Four modules declare `go 1.25.0` and the rest 1.24.4, so
# setup-go asks for 1.25 explicitly and GOTOOLCHAIN stays auto: the first makes
# the job independent of whatever the runner has installed, the second lets a
# module ask for a newer one later without this file changing.
#
# The chunker's Rust core. soloclef_chunker/chonkie is cgo over a static
# library (soloclef_chunker/chonkie/rust), and every module that imports the
# chunker links it in its tests: the library must exist before `go vet` or
# `go test` runs there. It is built for every job, because which modules reach
# it is a fact of their imports that changes, and a job that skipped it would
# fail on the day an import was added rather than on the day it was reviewed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build, vet, format and test
    runs-on: ubuntu-latest
    env:
      # A module may ask for a newer toolchain than the runner has, and some
      # do. This is what lets the go command fetch it.
      GOTOOLCHAIN: auto
    strategy:
      fail-fast: false
      matrix:
        # Each is its own module, required by the others through relative
        # replaces, so all of them are built from this checkout and none is
        # resolved from a proxy.
        module:
          - soloclef_agent
          - soloclef_api
          - soloclef_assistant
          - soloclef_automations
          - soloclef_celery
          - soloclef_chunker
          - soloclef_connectors
          - soloclef_filestore
          - soloclef_ingest
          - soloclef_mail
          - soloclef_mcp_go
          - soloclef_schema
          - soloclef_studio
          - soloclef_worker
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Rust toolchain
        # Pinned to the version the indexer's image builds with
        # (soloclef_worker/Dockerfile.indexer), so a crate that needs a newer
        # compiler fails here as it would there.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.89
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Chunker's Rust core
        # --locked: the crate versions are the ones Cargo.lock pins.
        run: cargo build --release --locked --manifest-path soloclef_chunker/chonkie/rust/Cargo.toml
      - name: Format
        working-directory: ${{ matrix.module }}
        # gofmt reports rather than fails, so the empty output is the check.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        # The integration tests skip themselves unless pointed at a throwaway
        # Postgres, Valkey or bucket, so this is the unit suite.
        run: go test ./...
