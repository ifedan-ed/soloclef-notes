name: Go

# The Go tiers' own checks: build, vet, format and test, for each of the four
# modules. They are in a workflow of their own rather than added to tests.yml
# because that file's two jobs are the Python and web suites, and the Python
# one is being deleted route by route as the port proceeds — nothing new goes
# into it.
#
# NOTHING HERE HAS EVER RUN, for the same reason tests.yml has not: every
# runner registered on this host is scoped to another repository and the one
# user-level registration went offline on 2026-05-11, so no runner accepts a
# job for danvics/soloclef. A green tick on this workflow means a job was
# cancelled while waiting, not that the checks passed. Until a runner is
# registered against this repository, the commands below are the ones to run by
# hand — they are exactly what `parity/README.md` and AGENTS.md ask for.
#
# THE TOOLCHAIN IS THE ONE THING THIS JOB NEEDS AND THIS HOST DOES NOT GIVE IT.
# soloclef_mcp_go declares `go 1.25.0`; the host's toolchain is 1.24.4, and it
# builds only because GOTOOLCHAIN=auto lets the go command download 1.25 on
# first use. A runner with no network to proxy.golang.org, or with
# GOTOOLCHAIN=local, fails on that module and on nothing else. So setup-go asks
# for 1.25 explicitly and GOTOOLCHAIN stays auto: the first is what makes the
# job independent of the host's installed version, the second is what lets a
# module ask for a newer one later without this file changing.
#
# THE PARITY SUITE CANNOT JOIN THIS JOB AS IT STANDS. `parity/run.sh` proves
# the port by byte-comparing the Go tier against the running Python tier
# (parity/README.md), and to do that it needs: a Docker daemon it may create
# containers on, the `soloclef-backend-fast:latest` image or the means to build
# it, and about half an hour for its 1,382 comparisons. A Forgejo runner with
# `docker` available and that image present could run `bash parity/run.sh` as
# one more job in this file, with no change to the suite — it already stands up
# its own world, refuses to run against anything live, and cleans up from a
# trap. Until there is such a runner, it is run by hand before a route is
# handed over.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build, vet, format and test
    runs-on: ubuntu-latest
    env:
      # A module may ask for a newer toolchain than the runner has, and one
      # does. This is what lets the go command fetch it.
      GOTOOLCHAIN: auto
    strategy:
      fail-fast: false
      matrix:
        # Each is its own module. soloclef_celery is required by the other two
        # Go tiers with a relative replace, so all of them are built from this
        # checkout and none is resolved from a proxy.
        module:
          - soloclef_celery
          - soloclef_worker
          - soloclef_api
          - soloclef_mcp_go
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-go@v5
        with:
          # The highest any module's go directive asks for
          # (soloclef_mcp_go/go.mod). The others ask for 1.24.4 and build
          # under it.
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Format
        working-directory: ${{ matrix.module }}
        # gofmt reports rather than fails, so the empty output is the check.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        # The integration tests skip themselves unless pointed at a throwaway
        # Postgres or Redis, so this is the unit suite
        # (soloclef_worker/internal/beat/redis_test.go).
        run: go test ./...
