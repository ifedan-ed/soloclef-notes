name: Go

# Build, vet, format and test every Go module, each in a job of its own.
#
# NOTHING HERE HAS EVER RUN: no runner has been registered for this
# repository (checked 2026-11-08). A green tick on this workflow means a job
# was cancelled while waiting, not that the checks passed. Until there is a
# runner, the commands below are the ones to run by hand (AGENTS.md).
#
# The toolchain. Four modules declare `go 1.25.0` and the rest 1.24.4, so
# setup-go asks for 1.25 explicitly and GOTOOLCHAIN stays auto: the first makes
# the job independent of whatever the runner has installed, the second lets a
# module ask for a newer one later without this file changing.
#
# The chunker's Rust core. soloclef_chunker/chonkie is cgo over a static
# library (soloclef_chunker/chonkie/rust), and every module that imports the
# chunker links it in its tests: the library must exist before `go vet` or
# `go test` runs there. It is built for every job, because which modules reach
# it is a fact of their imports that changes, and a job that skipped it would
# fail on the day an import was added rather than on the day it was reviewed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build, vet, format and test
    runs-on: ubuntu-latest
    env:
      # A module may ask for a newer toolchain than the runner has, and some
      # do. This is what lets the go command fetch it.
      GOTOOLCHAIN: auto
    strategy:
      fail-fast: false
      matrix:
        # Each is its own module, required by the others through relative
        # replaces, so all of them are built from this checkout and none is
        # resolved from a proxy.
        module:
          - soloclef_agent
          - soloclef_api
          - soloclef_assistant
          - soloclef_automations
          - soloclef_celery
          - soloclef_chunker
          - soloclef_connectors
          - soloclef_filestore
          - soloclef_ingest
          - soloclef_mail
          - soloclef_mcp_go
          - soloclef_notify
          - soloclef_sandboxd
          - soloclef_schema
          - soloclef_studio
          - soloclef_worker
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Rust toolchain
        # Pinned to the version the indexer's image builds with
        # (soloclef_worker/Dockerfile.indexer), so a crate that needs a newer
        # compiler fails here as it would there.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.89
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Chunker's Rust core
        # --locked: the crate versions are the ones Cargo.lock pins.
        run: cargo build --release --locked --manifest-path soloclef_chunker/chonkie/rust/Cargo.toml
      - name: Format
        working-directory: ${{ matrix.module }}
        # gofmt reports rather than fails, so the empty output is the check.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        # The integration tests skip themselves unless pointed at a throwaway
        # Postgres, Valkey or bucket, so this is the unit suite.
        run: go test ./...

  installed-builds:
    # The phone builds already installed from the App Store, held to the
    # server through the real server and a real Postgres
    # (soloclef_api/internal/installedbuilds, README.md). The contract test
    # sends every request those builds make through serve() and checks each
    # answer against the build's own openapi.json; on 2026-11-13 a shape
    # check passed and the Inbox still answered 500, which only a statement
    # that reached Postgres could show. SOLOCLEF_API_TEST_CONTRACT_REQUIRED
    # makes a missing database a failure here, never a skip
    # (installed_builds_coverage_test.go checks this file sets it).
    name: Installed phone builds' contract
    runs-on: ubuntu-latest
    services:
      postgres:
        # The deployment's own image (docker/docker-compose.go.yml).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: contract
          POSTGRES_PASSWORD: contract
          POSTGRES_DB: contract
        options: >-
          --health-cmd "pg_isready -U contract -d contract"
          --health-interval 2s --health-timeout 5s --health-retries 30
      valkey:
        image: valkey/valkey:9.1.2-alpine
    env:
      GOTOOLCHAIN: auto
      SOLOCLEF_API_TEST_CONTRACT_DATABASE: postgres://contract:contract@postgres:5432/contract?sslmode=disable
      SOLOCLEF_API_TEST_CONTRACT_VALKEY: redis://valkey:6379/0
      SOLOCLEF_API_TEST_CONTRACT_REQUIRED: "true"
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: soloclef_api/go.sum
      - name: Migrate the throwaway database
        # With the migrate command a deployment runs, so the server's
        # start-up schema check passes as it does in production. The secret
        # is the throwaway's own; an empty database has nothing to seal.
        working-directory: soloclef_schema
        run: |
          printf '%s' "ci-throwaway-$(date +%s%N)" > "$RUNNER_TEMP/migrate-secret"
          SOLOCLEF_MIGRATE_SECRET_KEY_FILE="$RUNNER_TEMP/migrate-secret" \
          SOLOCLEF_MIGRATE_DATABASE_URL="$SOLOCLEF_API_TEST_CONTRACT_DATABASE" \
            go run ./cmd/migrate up
      - name: Contract
        working-directory: soloclef_api
        run: go test ./cmd/api -run 'InstalledBuild|ContractCase|TestEveryCall' -count=1 -v
      - name: The app-versions report
        # The same throwaway database, after the contract: each opt-in test
        # empties the accounts it is given, so they run one after the other.
        working-directory: soloclef_api
        env:
          SOLOCLEF_API_TEST_APPVERSIONS_DATABASE: postgres://contract:contract@postgres:5432/contract?sslmode=disable
        run: go test ./internal/appversions ./internal/installedbuilds -count=1 -v
