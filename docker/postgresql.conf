# PostgreSQL configuration for Soloclef Notes
# This file is mounted into the PostgreSQL container

listen_addresses = '*'
max_connections = 200
# The whole database is a few hundred MB, so this caches it outright instead of
# re-reading chunks and their HNSW index from disk on every search.
# Needs a restart, not a reload.
shared_buffers = 2GB

# Enable logical replication (required for Zero-cache real-time sync)
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10

# Performance settings
checkpoint_timeout = 10min
max_wal_size = 1GB
min_wal_size = 80MB

# How much of the host's page cache the planner may assume is available to it.
# A hint only; it costs no memory.
effective_cache_size = 8GB

# Hybrid search sorts chunk rows by vector distance and ranks them by
# ts_rank_cd; at 4MB those passes spilled to disk. Per sort node per
# connection, so it is bounded by the pool caps in app/db.py.
work_mem = 32MB

# HNSW index builds and VACUUM. pgvector builds the graph in this much memory
# or falls back to a far slower on-disk build.
maintenance_work_mem = 1GB

# This host's storage is flash: measured p50 136us / p99 0.65ms for random 4K
# reads. The stock 4.0 told the planner seeks were ~4x a sequential page and
# biased it away from the HNSW and GIN index scans the retriever depends on.
# (The guest reports rotational=1 for its virtio disk; that flag is wrong here.)
random_page_cost = 1.1
effective_io_concurrency = 200

# 20 cores on this host.
max_parallel_workers_per_gather = 4

# Abandoned transactions are reaped here rather than per connection. The app
# used to ask for this in asyncpg's startup packet, with 15 min for the API and
# 60 min for Celery, but pgbouncer refuses an unsupported startup parameter and
# cannot track this one per client (Postgres never reports it back), so the
# value lives on the server, where it also survives the pooler's DISCARD ALL.
# 60 min is the more generous of the app's two: a long per-document embed
# window legitimately leaves a Celery transaction idle for a while. It never
# touches a session that is actually running a statement.
idle_in_transaction_session_timeout = 3600000

# Logging (optional, for debugging)
# log_statement = 'all'
# log_replication_commands = on
