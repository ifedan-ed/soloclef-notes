use_default_settings:
  engines:
    remove:
      - ahmia
      - torch
      - qwant
      - qwant news
      - qwant images
      - qwant videos
      - mojeek
      - mojeek images
      - mojeek news

server:
  secret_key: "override-me-via-env"
  # Temporary for owner testing, added 2026-09-27: the UI is also published at
  # https://search.danvics.com behind the Soloclef SSO (Caddy forward_auth).
  # base_url only shapes the links the HTML UI prints; the backend's JSON
  # calls to http://searxng:8080 are unaffected.
  base_url: "https://search.danvics.com/"
  public_instance: false
  # Stays off: the only public door is behind the SSO, and the backend's
  # research calls must never be throttled.
  limiter: false
  image_proxy: false
  method: "GET"
  default_http_headers:
    X-Robots-Tag: "noindex, nofollow"

search:
  # Dropping 'json' makes every fallback request 403.
  formats:
    - html
    - json
  default_lang: "auto"
  autocomplete: ""
  safe_search: 0
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 3600
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 600
    cf_SearxEngineCaptcha: 7200
    cf_SearxEngineAccessDenied: 3600
    recaptcha_SearxEngineCaptcha: 7200

ui:
  static_use_hash: true

outgoing:
  request_timeout: 12.0
  max_request_timeout: 20.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  extra_proxy_timeout: 10
  retries: 1
  # Uncomment and set your residential proxy URL to route search engine requests through it.
  # Format: http://<username>:<base64_password>@<hostname>:<port>/
  #
  # Home connection (cachyos-dell-desktop, tinyproxy over Tailscale): the
  # server's own address is walled by DuckDuckGo, Startpage and Brave.
  proxies:
    all://:
      - http://100.78.100.92:8888

engines:
  # Off on purpose: this instance only runs after Google walled us, and would
  # query it from the same address.
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: false
    weight: 1.1
    retry_on_http_error: [429, 503]
  - name: brave
    disabled: false
    weight: 1.0
    retry_on_http_error: [429, 503]
  # Off since 2026-09-27: through the proxy its web results were unrelated
  # to the query (Steam, radio and YouTube help pages). bing images stays on.
  - name: bing
    disabled: true
    weight: 0.9
    retry_on_http_error: [429, 503]
  - name: wikipedia
    disabled: false
    weight: 0.8
  # On since 2026-09-27: through the proxy it was the only web engine giving
  # relevant results (duckduckgo/startpage CAPTCHA, brave 429, yahoo protocol
  # error, bing answering with unrelated pages).
  - name: yandex
    disabled: false
    weight: 1.0
  - name: stackoverflow
    disabled: false
    weight: 0.7
  - name: yahoo
    disabled: false
    weight: 0.7
    retry_on_http_error: [429, 503]
  - name: wikidata
    disabled: false
    weight: 0.6
  - name: currency
    disabled: false
  - name: ddg definitions
    disabled: false

  # Image search (added 2026-09-27 for owner testing of search.danvics.com).
  # Every one of these returns the original full-size image URL, which the UI
  # shows as the image's own link in the result detail view. The backend's
  # research queries ask for categories=general, so none of these touch it.
  - name: google images
    disabled: true
  - name: yandex images
    disabled: false
  - name: bing images
    disabled: false
  - name: duckduckgo images
    disabled: false
  - name: brave.images
    disabled: false
  - name: startpage images
    disabled: false
  - name: flickr
    disabled: false
  - name: openverse
    disabled: false
  - name: wikicommons.images
    disabled: false
  - name: pixabay images
    disabled: false
  # Off: icon sets and museum art that crowd real image results, and three
  # engines whose parsers fail on this SearXNG release (2026-09-27 test).
  - name: devicons
    disabled: true
  - name: lucide
    disabled: true
  - name: artic
    disabled: true
  - name: pinterest
    disabled: true
  - name: unsplash
    disabled: true
  - name: pexels
    disabled: true
