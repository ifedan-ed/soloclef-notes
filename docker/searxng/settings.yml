use_default_settings:
  engines:
    remove:
      - ahmia
      - torch
      - qwant
      - qwant news
      - qwant images
      - qwant videos
      - mojeek
      - mojeek images
      - mojeek news

server:
  secret_key: "override-me-via-env"
  # Only shapes the links the HTML UI prints; the backend calls JSON at
  # http://searxng:8080 and is unaffected.
  base_url: "http://localhost:8080/"
  public_instance: false
  # Off: the backend's research calls must not be throttled.
  limiter: false
  image_proxy: false
  method: "GET"
  default_http_headers:
    X-Robots-Tag: "noindex, nofollow"

search:
  # Dropping 'json' makes every fallback request 403.
  formats:
    - html
    - json
  default_lang: "auto"
  autocomplete: ""
  safe_search: 0
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 3600
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 600
    cf_SearxEngineCaptcha: 7200
    cf_SearxEngineAccessDenied: 3600
    recaptcha_SearxEngineCaptcha: 7200

ui:
  static_use_hash: true

outgoing:
  request_timeout: 12.0
  max_request_timeout: 20.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  extra_proxy_timeout: 10
  retries: 1
  # Optional: route search-engine requests through a proxy.
  # proxies:
  #   all://:
  #     - http://user:pass@proxy.example.com:8080

engines:
  # Off by default: use the other engines unless you need Google.
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: false
    weight: 1.1
    retry_on_http_error: [429, 503]
  - name: brave
    disabled: false
    weight: 1.0
    retry_on_http_error: [429, 503]
  # Off by default; bing images stays on.
  - name: bing
    disabled: true
    weight: 0.9
    retry_on_http_error: [429, 503]
  - name: wikipedia
    disabled: false
    weight: 0.8
  # Yandex is useful when other engines rate-limit.
  - name: yandex
    disabled: false
    weight: 1.0
  - name: stackoverflow
    disabled: false
    weight: 0.7
  - name: yahoo
    disabled: false
    weight: 0.7
    retry_on_http_error: [429, 503]
  - name: wikidata
    disabled: false
    weight: 0.6
  - name: currency
    disabled: false
  - name: ddg definitions
    disabled: false

  # Image search. Each returns the original full-size image URL; the backend's
  # research queries ask for categories=general, so these are only for the UI.
  - name: google images
    disabled: true
  - name: yandex images
    disabled: false
  - name: bing images
    disabled: false
  - name: duckduckgo images
    disabled: false
  - name: brave.images
    disabled: false
  - name: startpage images
    disabled: false
  - name: flickr
    disabled: false
  - name: openverse
    disabled: false
  - name: wikicommons.images
    disabled: false
  - name: pixabay images
    disabled: false
  # Off: icon sets and museum art that crowd real image results, and three
  # engines whose parsers fail on this SearXNG release (2026-09-27 test).
  - name: devicons
    disabled: true
  - name: lucide
    disabled: true
  - name: artic
    disabled: true
  - name: pinterest
    disabled: true
  - name: unsplash
    disabled: true
  - name: pexels
    disabled: true
