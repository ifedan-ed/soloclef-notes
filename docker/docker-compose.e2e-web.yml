# =============================================================================
# SurfSense — isolated full stack for the web Playwright suite
# =============================================================================
# A second, throwaway copy of the whole app — Postgres, Redis, the E2E backend
# (fake LLM/embeddings, the /__e2e__ token mint), a Celery worker and beat, zero-cache,
# the frontend built from THIS checkout, and the same Caddy routing the live
# stack uses — under its own compose project and on its own loopback port.
#
# It never touches the live stack: different project name (surfsense-web-e2e),
# no named external volumes, Postgres on tmpfs, nothing published but
# 127.0.0.1:${E2E_WEB_PORT:-3940}.
#
# Do not run this by hand; use surfsense_web/scripts/e2e-stack.sh (up|down|
# status|logs), which builds the images and seeds the e2e user.
# =============================================================================

name: surfsense-web-e2e

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/surfsense_e2e  # pragma: allowlist secret
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  REDIS_APP_URL: redis://redis:6379/0
  CELERY_TASK_DEFAULT_QUEUE: surfsense
  SECRET_KEY: e2e-web-secret-key-not-for-production  # pragma: allowlist secret
  AUTH_TYPE: LOCAL
  REGISTRATION_ENABLED: "TRUE"
  ETL_DEFAULT_PARSER: LOCAL
  EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
  NEXT_FRONTEND_URL: http://127.0.0.1:${E2E_WEB_PORT:-3940}
  BACKEND_URL: http://127.0.0.1:${E2E_WEB_PORT:-3940}
  PYTHONPATH: /app
  # Sentinel keys: the fakes never read them, so a leaked real call is a 401.
  OPENAI_API_KEY: e2e-deny-real-call-sentinel  # pragma: allowlist secret
  ANTHROPIC_API_KEY: e2e-deny-real-call-sentinel  # pragma: allowlist secret
  LITELLM_API_KEY: e2e-deny-real-call-sentinel  # pragma: allowlist secret
  # Any Python outbound HTTP that escapes the fakes fails fast instead of
  # reaching a paid provider. The worker also has no route out at all.
  HTTPS_PROXY: http://127.0.0.1:1
  HTTP_PROXY: http://127.0.0.1:1
  NO_PROXY: localhost,127.0.0.1,0.0.0.0,db,redis,backend,frontend,zero-cache,proxy,nextcloud-stub,google-stub
  # The stand-in Nextcloud (tests/e2e/fakes/nextcloud_server.py) for Connect.
  NEXTCLOUD_BASE_URL: http://nextcloud-stub:8080
  NEXTCLOUD_LOGIN_START_LIMIT: "1000"
  # The stand-in Google (tests/e2e/fakes/google_server.py): consent through the
  # proxy at /__google__/, token/revoke/Drive API straight to the service.
  GOOGLE_OAUTH_CLIENT_ID: 123456789012-e2e.apps.googleusercontent.com
  GOOGLE_OAUTH_CLIENT_SECRET: e2e-google-client-secret  # pragma: allowlist secret
  GOOGLE_PICKER_API_KEY: e2e-picker-key  # pragma: allowlist secret
  GOOGLE_DRIVE_REDIRECT_URI: http://127.0.0.1:${E2E_WEB_PORT:-3940}/api/v1/auth/google/drive/connector/callback
  GOOGLE_OAUTH_AUTH_URI: http://127.0.0.1:${E2E_WEB_PORT:-3940}/__google__/o/oauth2/auth
  GOOGLE_OAUTH_TOKEN_URI: http://google-stub:8080/token
  GOOGLE_OAUTH_REVOKE_URI: http://google-stub:8080/revoke
  GOOGLE_DRIVE_API_ENDPOINT: http://google-stub:8080/drive/v3/
  # The stand-in speaks plain HTTP inside the internal network.
  OAUTHLIB_INSECURE_TRANSPORT: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  SANDBOX_ENABLED: "FALSE"
  # Lets an Audio Overview be queued (so Studio's success path is testable);
  # the run then fails offline, no speech is ever synthesised.
  TTS_SERVICE: openai/tts-1
  TTS_SERVICE_API_KEY: e2e-deny-real-call-sentinel  # pragma: allowlist secret
  E2E_MINT_SECRET: e2e-mint-secret-not-for-production  # pragma: allowlist secret
  # Cloudflare's documented always-pass test secret; the E2E backend fakes
  # siteverify (no route out), so the check runs but always succeeds.
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA  # pragma: allowlist secret
  # A published Report Issue address (no server's real one), as SUPPORT_EMAIL
  # sets it on a live server.
  SUPPORT_EMAIL: help@notes.example.test

services:
  db:
    image: pgvector/pgvector:pg17
    command: >
      postgres
        -c wal_level=logical
        -c max_wal_senders=10
        -c max_replication_slots=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
      POSTGRES_DB: surfsense_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d surfsense_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

  backend:
    build:
      context: ../surfsense_backend
      dockerfile: Dockerfile
      target: e2e
      additional_contexts:
        tests-source: ../surfsense_backend/tests
      args:
        EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    image: surfsense-web-e2e-backend:local
    environment:
      <<: *backend-env
      SERVICE_ROLE: api
    volumes:
      - shared_temp:/shared_tmp
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              r = urllib.request.urlopen("http://localhost:8000/openapi.json", timeout=2)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 3s
      timeout: 5s
      retries: 80
      start_period: 30s
    networks: [internal]

  celery_worker:
    image: surfsense-web-e2e-backend:local
    pull_policy: never
    environment:
      <<: *backend-env
      SERVICE_ROLE: worker
    volumes:
      - shared_temp:/shared_tmp
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]

  # Fires scheduled automations (the schedule selector ticks every minute).
  celery_beat:
    image: surfsense-web-e2e-backend:local
    pull_policy: never
    environment:
      <<: *backend-env
      SERVICE_ROLE: beat
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]

  # Nextcloud's Login Flow, OCS and WebDAV, faked; the browser reaches its
  # sign-in page through the proxy at /__nextcloud__/.
  nextcloud-stub:
    image: surfsense-web-e2e-backend:local
    pull_policy: never
    entrypoint: ["python", "/app/tests/e2e/fakes/nextcloud_server.py"]
    environment:
      NEXTCLOUD_STUB_INTERNAL_URL: http://nextcloud-stub:8080
      NEXTCLOUD_STUB_PUBLIC_URL: http://127.0.0.1:${E2E_WEB_PORT:-3940}/__nextcloud__
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]

  # Google's consent page, token and revoke endpoints and the Drive v3 calls,
  # faked; the browser reaches the consent page through the proxy at /__google__/.
  google-stub:
    image: surfsense-web-e2e-backend:local
    pull_policy: never
    entrypoint: ["python", "/app/tests/e2e/fakes/google_server.py"]
    environment:
      GOOGLE_STUB_PUBLIC_URL: http://127.0.0.1:${E2E_WEB_PORT:-3940}/__google__
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]

  zero-cache:
    image: rocicorp/zero:1.6.0
    environment:
      ZERO_UPSTREAM_DB: postgresql://postgres:postgres@db:5432/surfsense_e2e?sslmode=disable  # pragma: allowlist secret
      ZERO_CVR_DB: postgresql://postgres:postgres@db:5432/surfsense_e2e?sslmode=disable  # pragma: allowlist secret
      ZERO_CHANGE_DB: postgresql://postgres:postgres@db:5432/surfsense_e2e?sslmode=disable  # pragma: allowlist secret
      ZERO_REPLICA_FILE: /tmp/zero.db
      ZERO_ADMIN_PASSWORD: e2e-zero-admin
      ZERO_APP_PUBLICATIONS: zero_publication
      ZERO_AUTO_RESET: "true"
      ZERO_NUM_SYNC_WORKERS: "2"
      ZERO_QUERY_URL: http://frontend:3000/api/zero/query
      ZERO_MUTATE_URL: http://frontend:3000/api/zero/mutate
      ZERO_QUERY_FORWARD_COOKIES: "true"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848/keepalive"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 20s
    networks: [internal]

  frontend:
    build:
      context: ../surfsense_web
      dockerfile: Dockerfile
      target: runner
      # The public pages' own address and contact, as docker-compose.yml
      # passes them from docker/.env; example values, never a real server's.
      args:
        NEXT_PUBLIC_SITE_URL: https://notes.example.test
        NEXT_PUBLIC_SUPPORT_EMAIL: help@notes.example.test
    image: surfsense-web-e2e-frontend:local
    environment:
      AUTH_TYPE: LOCAL
      ETL_DEFAULT_PARSER: LOCAL
      DEPLOYMENT_MODE: self-hosted
      SURFSENSE_BACKEND_INTERNAL_URL: http://backend:8000
      # Cloudflare's always-pass test site key: the browser loads the real
      # widget from challenges.cloudflare.com and gets a dummy token.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]

  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${E2E_WEB_PORT:-3940}:80"
    volumes:
      - ./proxy/Caddyfile.e2e:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend: { condition: service_started }
      backend: { condition: service_healthy }
      zero-cache: { condition: service_healthy }
    networks: [internal, ingress]

networks:
  # No route out: the backend, worker, database and zero-cache cannot reach
  # the internet or the host. Only the proxy also joins `ingress`, so the
  # published loopback port has somewhere to land.
  internal:
    driver: bridge
    internal: true
  ingress:
    driver: bridge

volumes:
  shared_temp:
