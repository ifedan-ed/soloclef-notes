# Every query this tier runs is generated from the migrations in
# ../soloclef_schema/migrations: the same numbered SQL files the migrate
# command applies to a database. There is no copy of the schema and nothing
# to keep in step with one; a query that names a column no migration
# creates fails here, at generate time, instead of at request time.
#
#   sqlc generate
#
# regenerates every package. ../soloclef_schema/scripts/sqlc_status.sh runs
# each block on its own and says which, if any, no longer compiles against
# the migrations, which is quicker to read than sqlc's first error.
#
# One block per vertical slice: a slice owns its SQL and its generated code,
# and nothing generates into a package that two routes share by accident.
# A package that is deleted has its block deleted with it, or the next
# generate writes its code back.
#
# The first block carries the anchors the others merge (&slice, &slice_go,
# &slice_overrides), and sqlc_status.sh reads it as the template for one
# block. It is accesstokens because that package stays.
#
# The overrides are the same in every block because they are about this
# database, not about one slice:
#   uuid  -> string, because every caller id in this tier is the text form
#            the session token carries (internal/principal).
#   int4  -> int64, so that a count or a position is the same Go type as an
#            id (ids are bigint, which sqlc already makes int64) and nothing
#            is narrowed on its way to Postgres.
#   timestamptz -> time.Time, because every timestamp here is rendered by
#            internal/pythonjson, which formats a time.Time.
version: "2"
sql:
  - &slice
    engine: postgresql
    schema: ../soloclef_schema/migrations
    queries: internal/accesstokens/queries.sql
    gen:
      go: &slice_go
        package: accesstokens
        out: internal/accesstokens
        sql_package: pgx/v5
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        output_db_file_name: connection.sql.go
        output_models_file_name: tables.sql.go
        overrides: &slice_overrides
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int4
            go_type: int64
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # The migrations spell the type `timestamptz`, and sqlc matches an
          # override on the spelling it read, not on the type it resolves to:
          # without this pair a timestamp column of the new schema comes out
          # as pgtype.Timestamptz. The pg_catalog pair above still covers a
          # cast written `::pg_catalog.timestamptz` in a query.
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
  - <<: *slice
    queries: internal/activitysummary/queries.sql
    gen:
      go:
        <<: *slice_go
        package: activitysummary
        out: internal/activitysummary
